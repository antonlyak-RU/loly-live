name: Build Loly Live APK

on:
push:
branches: [ main, master ]
workflow_dispatch:

jobs:
build-apk:
runs-on: ubuntu-latest
steps:
- name: Checkout Source Code
uses: actions/checkout@v4

  - name: Setup Node.js Environment
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install Project Dependencies
    run: npm install

  - name: Build Web Application
    run: npm run build

  - name: Install Capacitor CLI
    run: npm install -g @capacitor/cli

  - name: Initialize Android Native Project
    run: |
      npx cap add android
      npx cap sync android

  - name: Inject Permissions (Camera, Microphone, Internet)
    run: |
      MANIFEST="android/app/src/main/AndroidManifest.xml"
      PERMS='    <uses-permission android:name="android.permission.INTERNET" />\\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\\n    <uses-permission android:name="android.permission.CAMERA" />\\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />'
      sed -i "/<manifest/a $PERMS" "$MANIFEST"

  - name: Compile APK via Gradle
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK to Artifacts
    uses: actions/upload-artifact@v4
    with:
      name: LolyLive-debug-apk
      path: android/app/build/outputs/apk/debug/app-debug.apk
      retention-days: 14
